codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "40...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 60%
        threshold: 5%
        informational: true

component_management:
  individual_components:
    - component_id: tokens
      name: tokens
      paths:
        - "httpjpg-kit/Sources/Tokens/**"
    - component_id: design-system
      name: design-system
      paths:
        - "httpjpg-kit/Sources/DesignSystem/**"
    - component_id: storyblok
      name: storyblok
      paths:
        - "httpjpg-kit/Sources/StoryblokCore/**"
        - "httpjpg-kit/Sources/StoryblokContent/**"
    - component_id: portfolio
      name: portfolio
      paths:
        - "httpjpg-kit/Sources/PortfolioFeature/**"
    - component_id: widgets
      name: widgets
      paths:
        - "httpjpg-kit/Sources/WidgetFeature/**"
    - component_id: watch
      name: watch
      paths:
        - "httpjpg-kit/Sources/WatchFeature/**"

ignore:
  - "httpjpg-kit/Tests/**"
  - "httpjpg/**"
  - "httpjpg-watch/**"
  - "httpjpg-widgets/**"
  - "**/.build/**"
  - "**/DerivedData/**"

comment:
  layout: "reach,diff,components,tree"
  behavior: default
  require_changes: false
