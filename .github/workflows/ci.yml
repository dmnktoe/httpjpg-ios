name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bloks:
    name: Blok registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: httpjpg-ios

      - uses: actions/checkout@v4
        with:
          repository: dmnktoe/httpjpg
          path: httpjpg

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check-blok-registry.mjs --web-repo=../httpjpg
        working-directory: httpjpg-ios

  build:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Build app
        shell: bash
        run: |
          xcodebuild build \
            -project httpjpg.xcodeproj \
            -scheme httpjpg \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log \
            | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
        env:
          NSUnbufferedIO: YES

      - name: Raw build log
        if: failure()
        run: grep -n -B2 -A6 -i 'error' build.log | tail -100 || tail -100 build.log

      - name: Test package
        shell: bash
        working-directory: HttpjpgKit
        run: |
          xcodebuild test \
            -scheme HttpjpgKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log \
            | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
        env:
          NSUnbufferedIO: YES

      - name: Raw test log
        if: failure()
        run: grep -n -B2 -A6 -i 'error' HttpjpgKit/test.log | tail -100 || tail -100 HttpjpgKit/test.log
