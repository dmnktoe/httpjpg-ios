name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Skip the pipeline on release PRs (mirrors httpjpg) ──────────────
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Classify the ref
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == release-please--* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR ($HEAD_REF) — skipping CI, its commits already passed on main."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  bloks:
    name: Blok registry
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: httpjpg-ios

      - uses: actions/checkout@v4
        with:
          repository: dmnktoe/httpjpg
          path: httpjpg

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check-blok-registry.mjs --web-repo=../httpjpg
        working-directory: httpjpg-ios

  build:
    name: Build & test
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          has_ios_runtime() {
            xcrun simctl list runtimes --json \
              | jq -e '[.runtimes[] | select(.isAvailable and (.platform == "iOS" or (.identifier | test("SimRuntime.iOS"))))] | length > 0' >/dev/null
          }
          for app in $(ls -d /Applications/Xcode*.app | sort -Vr); do
            sudo xcode-select -s "$app/Contents/Developer"
            if has_ios_runtime; then break; fi
            echo "$app has no iOS simulator runtime"
          done
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve simulator
        shell: bash
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("iPhone"))] | last | .udid // empty')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.isAvailable and (.platform == "iOS" or (.identifier | test("SimRuntime.iOS"))))] | last | .identifier // empty')
            if [ -z "$runtime" ]; then
              echo "no iOS simulator runtime on this image" >&2
              exit 1
            fi
            devtype=$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.productFamily == "iPhone")] | last | .identifier')
            udid=$(xcrun simctl create ci-iphone "$devtype" "$runtime")
          fi
          xcrun simctl list devices available
          echo "SIMULATOR=id=$udid" >> "$GITHUB_ENV"

      - name: Build app
        shell: bash
        run: |
          xcodebuild build \
            -project httpjpg.xcodeproj \
            -scheme httpjpg \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log \
            | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
        env:
          NSUnbufferedIO: YES

      - name: Raw build log
        if: failure()
        run: grep -n -B2 -A6 -i 'error' build.log | tail -100 || tail -100 build.log

      - name: Test package
        shell: bash
        working-directory: httpjpg-kit
        run: |
          scheme=$(xcodebuild -list -json | jq -r '[(.workspace // .project).schemes[] | select(endswith("-Package"))] | first // empty')
          if [ -z "$scheme" ]; then
            xcodebuild -list
            echo "no aggregate package scheme" >&2
            exit 1
          fi
          echo "scheme: $scheme"
          xcodebuild test \
            -scheme "$scheme" \
            -destination "$SIMULATOR" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log \
            | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
        env:
          NSUnbufferedIO: YES

      - name: Raw test log
        if: failure()
        run: grep -n -B2 -A6 -i 'error' httpjpg-kit/test.log | tail -100 || tail -100 httpjpg-kit/test.log

  ci:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [guard, bloks, build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI Results"
            echo ""
            if [[ "${{ needs.guard.outputs.run }}" != "true" ]]; then
              echo "Release PR — pipeline skipped, every commit in it already passed on \`main\`."
              echo ""
            fi
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Blok registry | ${{ needs.bloks.result }} |"
            echo "| Build & test  | ${{ needs.build.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify all jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
