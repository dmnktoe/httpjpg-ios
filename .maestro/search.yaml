appId: com.yl33ly.httpjpg
# Walks the ask/search sheet and saves a screenshot per state. Search and ask
# hit the live site API, so this flow needs network and costs one ask.
# Maestro keeps the shots under ~/.maestro/tests/<run>/search/takeScreenshot/.
---
- launchApp
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 45000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "search or ask…"
    timeout: 20000
- takeScreenshot: search-01-idle
- tapOn: "search or ask…"
- inputText: "what is blence about"
- extendedWaitUntil:
    visible: ".*match.*"
    timeout: 30000
- takeScreenshot: search-02-results
- pressKey: Enter
# No assertion here: a fast answer is settled before "thinking" could be asserted.
- takeScreenshot: search-03-asking
# "answer" once the stream settled, "no answer" if the assistant failed; both are worth a picture.
- extendedWaitUntil:
    visible: "answer|no answer"
    timeout: 150000
- takeScreenshot: search-04-answer-fresh
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: search-05-answer-settled
- scroll
- takeScreenshot: search-06-answer-scrolled
- tapOn: "Close search"
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 20000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "recent"
    timeout: 20000
- takeScreenshot: search-07-recent
