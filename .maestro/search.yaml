appId: com.yl33ly.httpjpg
# Walks the ask/search sheet and saves a screenshot per state. Search and ask
# hit the live site API, so this flow needs network and costs one ask.
# Maestro keeps the shots under ~/.maestro/tests/<run>/search/takeScreenshot/.
---
- launchApp
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 45000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "search or ask…"
    timeout: 20000
- takeScreenshot: search-01-idle
- tapOn: "search or ask…"
- inputText: "what is blence about"
- extendedWaitUntil:
    visible: ".*match.*"
    timeout: 30000
- takeScreenshot: search-02-results
# Maestro normally waits for the UI to settle after an action; the glow animates until it
# fades, so a settling tap (or Enter) only returns once the glow is already gone.
- tapOn:
    text: "Ask"
    waitToSettleTimeoutMs: 200
- takeScreenshot: search-03-thinking-glow
- extendedWaitUntil:
    visible: "answering"
    timeout: 30000
    optional: true
- takeScreenshot: search-04-streaming-glow
# "answer" once the stream settled, "no answer" if the assistant failed; both are worth a picture.
- extendedWaitUntil:
    visible: "answer|no answer"
    timeout: 150000
- takeScreenshot: search-05-answer-lingering-glow
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: search-06-answer-settled
- scroll
- takeScreenshot: search-07-answer-scrolled
- tapOn: "Close search"
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 20000
- tapOn: "Search"
# The sheet reopens on the last query; recents only show on an empty field.
- tapOn: "Clear search"
- extendedWaitUntil:
    visible: "recent"
    timeout: 20000
- takeScreenshot: search-08-recent
