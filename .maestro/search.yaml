appId: com.yl33ly.httpjpg
# Walks the ask/search sheet and saves a screenshot per state. Search and ask
# hit the live site API, so this flow needs network and costs one ask.
---
- launchApp
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 45000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Search or ask…"
    timeout: 20000
- takeScreenshot: search-01-idle
- tapOn: "Search or ask…"
- inputText: "what is blence about"
- extendedWaitUntil:
    visible: ".*match.*"
    timeout: 30000
- takeScreenshot: search-02-results
- pressKey: Enter
- extendedWaitUntil:
    visible: "thinking|answering"
    timeout: 20000
- takeScreenshot: search-03-thinking
- extendedWaitUntil:
    visible: "answer"
    timeout: 90000
- takeScreenshot: search-04-answer-glowing
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: search-05-answer-settled
- scroll
- takeScreenshot: search-06-answer-scrolled
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 20000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "recent"
    timeout: 20000
- takeScreenshot: search-07-recent
