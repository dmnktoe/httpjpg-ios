# XcodeGen spec for Httpjpg.xcodeproj.
#
# The generated project is checked in, so you do NOT need XcodeGen to build.
# Regenerate with `xcodegen generate` after changing target structure, so the
# project file stays reviewable instead of accumulating Xcode's churn.
name: Httpjpg
options:
  bundleIdPrefix: com.httpjpg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

configs:
  Debug: debug
  Release: release

packages:
  HttpjpgKit:
    path: HttpjpgKit

fileGroups:
  - Config
  - README.md
  - DECISIONS.md

targets:
  Httpjpg:
    type: application
    platform: iOS
    sources:
      - path: Httpjpg
    dependencies:
      - package: HttpjpgKit
        product: DesignSystem
      - package: HttpjpgKit
        product: StoryblokContent
      - package: HttpjpgKit
        product: PortfolioFeature
      - package: HttpjpgKit
        product: WidgetFeature
      - target: HttpjpgWidgets
        embed: true
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Httpjpg/Info.plist
        GENERATE_INFOPLIST_FILE: true
        ENABLE_PREVIEWS: true

  HttpjpgWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HttpjpgWidgets
    dependencies:
      - package: HttpjpgKit
        product: DesignSystem
      - package: HttpjpgKit
        product: StoryblokContent
      - package: HttpjpgKit
        product: WidgetFeature
    configFiles:
      Debug: Config/Widgets.xcconfig
      Release: Config/Widgets.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
