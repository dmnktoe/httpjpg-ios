project: httpjpg.xcodeproj
schemes:
  - httpjpg
targets:
  - httpjpg
  - httpjpg-widgets
  - httpjpg-watch
retain_public: true
retain_objc_accessible: true
retain_swift_ui_previews: true
baseline: periphery-baseline.json
format: github-actions
# storyblok-swift ships macros; Xcode refuses the index build without this.
build_arguments:
  - -skipMacroValidation
